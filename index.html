    <!-- Google Analytics 4 with Consent Mode v2. analytics_storage is DENIED by
         default; the consent banner flips it to granted on Accept. A returning
         accepter is granted here (before config) so gtag.js starts in the right
         consent state — but the page_view itself is recorded by the app (on
         mount for a returning accepter, on Accept for a first-timer), exactly
         once per load. Only runs when a G- measurement id is configured (id
         interpolated by Vite; the repo stays value-free). No id = nothing loads. -->
    <script>
      (function () {
        var GA_ID = "%VITE_GA_MEASUREMENT_ID%";
        if (GA_ID.indexOf("G-") !== 0) return;
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("consent", "default", {
          analytics_storage: "denied",
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
        });
        var accepted = false;
        try {
          var c = JSON.parse(localStorage.getItem("ccl-consent") || "null");
          accepted = !!c && c.v === 1 && c.choice === "accept" && Date.now() - c.ts < 31536000000;
        } catch (e) {}
        if (accepted) gtag("consent", "update", { analytics_storage: "granted" });
        gtag("js", new Date());
        // send_page_view:false so config never auto-sends a page_view (that would
        // be a cookieless ping while denied). The app fires gtag('event','page_view')
        // once per load — on mount for a returning accepter, on Accept otherwise.
        gtag("config", GA_ID, { send_page_view: false });
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
      })();
    </script>
